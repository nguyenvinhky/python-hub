<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Hub — Ôn tập Danh sách &amp; Xâu ký tự</title>

<!-- Tailwind CDN + config -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'Consolas', 'monospace'],
        },
        colors: {
          brand: {
            50:'#f5f3ff',100:'#ede9fe',200:'#ddd6fe',300:'#c4b5fd',
            400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',
            800:'#5b21b6',900:'#4c1d95',
          },
          accent: { 400:'#22d3ee', 500:'#06b6d4', 600:'#0891b2' },
        },
      }
    }
  }
</script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Custom styles -->
<link rel="stylesheet" href="assets/css/styles.css">

<!-- Pyodide -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

<!-- Prism.js (syntax highlighting) — data-manual: chỉ highlight khi ta chủ động gọi -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js" data-manual></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen font-sans">

<!-- TOP NAVIGATION -->
<header class="sticky top-0 z-40 glass border-b border-slate-200/60 dark:border-slate-800/60">
  <div class="max-w-[1600px] mx-auto px-4 lg:px-6 h-16 flex items-center gap-3">
    <button id="btnHamburger" aria-label="Mở menu" class="lg:hidden p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-600 to-accent-500 flex items-center justify-center shadow-sm">
        <span class="text-white text-lg">🐍</span>
      </div>
      <div class="hidden sm:block">
        <h1 class="font-bold text-base leading-tight">Python Hub</h1>
        <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-tight">Danh sách &amp; Xâu ký tự</p>
      </div>
    </div>

    <div class="hidden md:flex items-center gap-2 mx-auto max-w-md w-full px-3.5 h-9 bg-slate-100 dark:bg-slate-800/80 rounded-lg text-sm text-slate-500 dark:text-slate-400">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span>Tìm câu hỏi... (sắp có)</span>
      <kbd class="ml-auto text-[10px] px-1.5 py-0.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded font-mono">⌘ K</kbd>
    </div>

    <div class="flex items-center gap-1.5 ml-auto">
      <div id="topProgressPill" class="hidden sm:flex items-center gap-2 px-3 h-9 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 rounded-lg text-sm font-medium">
        0/10 hoàn thành
      </div>
      <button id="themeBtn" aria-label="Đổi theme" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
        <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <a href="https://github.com" target="_blank" rel="noopener" class="w-9 h-9 rounded-full bg-gradient-to-br from-brand-500 to-accent-500 text-white font-semibold text-sm flex items-center justify-center ring-2 ring-white dark:ring-slate-900 hover:ring-brand-300 transition" aria-label="GitHub">KV</a>
    </div>
  </div>
</header>

<!-- Mobile drawer (sidebar clone) -->
<div id="drawerBackdrop" class="drawer-backdrop lg:hidden"></div>
<aside id="drawer" class="drawer lg:hidden"></aside>

<!-- Main (rendered by UI.js) -->
<div id="main-content"></div>

<!-- Mobile bottom nav -->
<nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 glass border-t border-slate-200 dark:border-slate-800 h-16 flex">
  <button onclick="window.UI.openDrawer()" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-brand-600 dark:text-brand-400">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    <span class="text-[10px] font-semibold">Câu hỏi</span>
  </button>
  <button onclick="document.getElementById('codeEditor')?.scrollIntoView({behavior:'smooth'})" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-slate-400">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
    <span class="text-[10px]">Code</span>
  </button>
  <button onclick="document.getElementById('tracerSection')?.scrollIntoView({behavior:'smooth'})" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-slate-400">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <span class="text-[10px]">Trực quan</span>
  </button>
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-slate-400">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg>
    <span class="text-[10px]">Đầu trang</span>
  </button>
</nav>

<!-- Viewport badge -->
<div class="fixed bottom-20 lg:bottom-4 left-4 z-50 px-3 py-1.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-full text-xs font-mono shadow-lg opacity-70">
  <span id="vpw">—</span> × <span id="vph">—</span>
</div>

<!-- Scripts (order matters — dependency chain) -->
<script src="assets/data/questions.js"></script>
<script src="assets/js/progress.js"></script>
<script src="assets/js/pyodide-runner.js"></script>
<script src="assets/js/tracer.js"></script>
<script src="assets/js/test-runner.js"></script>
<script src="assets/js/visualizer.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
